name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Database tests use a throwaway database on the cluster in the MONGODB_URI secret and are skipped without it.
      - run: npm run test:backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
